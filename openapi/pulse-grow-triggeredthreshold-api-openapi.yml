openapi: 3.2.0
info:
  title: Pulse Triggered Threshold API
  description: '# Introduction


    The Pulse API is an HTTP API that is designed to interact with your pulse account and devices.'
  termsOfService: https://pulsegrow.com/terms
  contact:
    name: Need help? Contact support
    email: support@pulsegrow.com
  version: v1
  x-logo:
    url: https://cdn.shopify.com/s/files/1/2451/2393/files/logo_1_400x.png
    altText: The Logo
tags:
- name: TriggeredThreshold
  description: A collection of API operations related to timeline events.
paths:
  /api/triggered-thresholds:
    get:
      tags:
      - TriggeredThreshold
      summary: Retrieves triggered thresholds for a grow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SortedTriggeredThresholdsDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: string
      operationId: getApiTriggeredThresholds
      x-operation-id-source: derived
components:
  schemas:
    SensorThresholdType:
      type: integer
      format: int32
    ViewTriggeredThresholdDto:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int32
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type:
          - string
          - 'null'
          format: date-time
        resolved:
          type: boolean
        thresholdId:
          type:
          - integer
          - 'null'
          format: int32
        thresholdType:
          $ref: '#/components/schemas/ThresholdType'
        deviceId:
          type: integer
          format: int32
        deviceName:
          type:
          - string
          - 'null'
        lowOrHigh:
          type: boolean
        lowThresholdValue:
          type:
          - number
          - 'null'
          format: double
        highThresholdValue:
          type:
          - number
          - 'null'
          format: double
        triggeringValue:
          type:
          - string
          - 'null'
        sensorThresholdType:
          $ref: '#/components/schemas/SensorThresholdType'
        hubThresholdType:
          $ref: '#/components/schemas/HubThresholdType'
      additionalProperties: false
    HubThresholdType:
      type: integer
      format: int32
    ThresholdType:
      type: integer
      format: int32
    SortedTriggeredThresholdsDto:
      type: object
      properties:
        ongoing:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViewTriggeredThresholdDto'
        resolved:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ViewTriggeredThresholdDto'
        growId:
          type: integer
          format: int32
      additionalProperties: false
